<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-label="Meeting Translator architecture">
  <rect width="980" height="420" rx="18" fill="#0b1214"/>
  <text x="40" y="48" fill="#e7f4f2" font-family="Outfit, Segoe UI, sans-serif" font-size="28" font-weight="700">Meeting Translator</text>
  <text x="40" y="76" fill="#8aa3a8" font-family="Outfit, Segoe UI, sans-serif" font-size="15">Live captions · EN / ES / PT · phone to TV</text>

  <g font-family="Outfit, Segoe UI, sans-serif">
    <rect x="40" y="110" width="250" height="150" rx="14" fill="#132024" stroke="#2bb3a3"/>
    <text x="60" y="142" fill="#7fd1c7" font-size="13" font-weight="700" letter-spacing="1">HOST PHONE</text>
    <text x="60" y="170" fill="#e7f4f2" font-size="16">Create room</text>
    <text x="60" y="194" fill="#e7f4f2" font-size="16">Mic · EN | ES | PT</text>
    <text x="60" y="218" fill="#8aa3a8" font-size="14">Smart View mirrors this screen</text>
    <text x="60" y="240" fill="#8aa3a8" font-size="14">iPhone can Type + Send</text>

    <rect x="365" y="110" width="250" height="150" rx="14" fill="#132024" stroke="#24383c"/>
    <text x="385" y="142" fill="#7fd1c7" font-size="13" font-weight="700" letter-spacing="1">ONE NODE PROCESS</text>
    <text x="385" y="170" fill="#e7f4f2" font-size="16">HTTP + WebSocket</text>
    <text x="385" y="194" fill="#e7f4f2" font-size="16">POST /api/translate</text>
    <text x="385" y="218" fill="#8aa3a8" font-size="14">DeepL ’ MyMemory ’ MinT ’ mock</text>
    <text x="385" y="240" fill="#8aa3a8" font-size="14">Final captions only on TV</text>

    <rect x="690" y="110" width="250" height="150" rx="14" fill="#132024" stroke="#24383c"/>
    <text x="710" y="142" fill="#7fd1c7" font-size="13" font-weight="700" letter-spacing="1">TV BROWSER</text>
    <text x="710" y="170" fill="#e7f4f2" font-size="16">Send to TV · QR / link</text>
    <text x="710" y="194" fill="#e7f4f2" font-size="16">EN | ES | PT together</text>
    <text x="710" y="218" fill="#8aa3a8" font-size="14">Or one language per monitor</text>
    <text x="710" y="240" fill="#8aa3a8" font-size="14">TVs own browser, not a cast</text>

    <rect x="200" y="300" width="580" height="78" rx="14" fill="#132024" stroke="#24383c"/>
    <text x="220" y="332" fill="#7fd1c7" font-size="13" font-weight="700" letter-spacing="1">GUEST PHONES</text>
    <text x="220" y="356" fill="#e7f4f2" font-size="16">Join QR · Android and iPhone · same EN | ES | PT panes · one speaker · host can reclaim the mic</text>
  </g>

  <path d="M290 185 H365" stroke="#2bb3a3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M615 185 H690" stroke="#2bb3a3" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2bb3a3"/>
    </marker>
  </defs>
</svg>
